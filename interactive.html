<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Student Dashboard</title>
    <link rel="stylesheet" href="interactive.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
  <h1>Interactive Student Dashboard</h1>
  <p>Stay motivated and organized!</p>
</header>

<main>
  <section>
    <h2>Motivation Counter</h2>
    <p id="message">You have clicked the button 0 times!</p>
    <button id="changeButton">Click Me!</button>
  </section>

  <section>
    <h2>Customize Your Color</h2>

    <label for="colorInput">Choose a color:</label>
    <input type="color" id="colorInput" value="#9333ea">

    <div id="colorBox">
      Watch my color change!
    </div>
  </section>

  <section>
    <h2>My Study To-Do List</h2>

    <label for="taskInput">Enter a study task:</label>
    <input type="text" id="taskInput"
           placeholder="Enter a task">

    <button id="addButton">Add Task</button>

    <ul id="taskList"></ul>
  </section>
</main>

<footer>
  <p>JavaScript Interactivity Project</p>
</footer>
